name: D1 Automated Database Backups (6-Hour)

# ==============================================================================
# Cloudflare D1 Automated Backup Workflow (Free Plan: $0/mo, No Payment Card)
#
# Context & Requirements:
# - Exports BOTH D1 databases (careone-db and careone-files) via Wrangler.
# - Encrypts exports with 'age' before storage to protect clinical personal data.
# - Stores encrypted backups as GitHub Actions artifacts with 30-day retention.
# - Zero object storage costs, zero Workers Paid, zero Cloudflare paid features.
# - Runs automatically every 6 hours and supports manual trigger (workflow_dispatch).
# ==============================================================================

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: d1-backup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backup:
    name: Export, Encrypt & Store D1 Backups
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --no-save wrangler@^4.149.0

      - name: Install age Encryption Tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age

      - name: Export D1 Databases
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is required to export D1 databases."
            exit 1
          fi

          echo "Exporting careone-db..."
          npx wrangler d1 export careone-db --remote --output backup-careone-db.sql

          echo "Exporting careone-files..."
          npx wrangler d1 export careone-files --remote --output backup-careone-files.sql

          # Verify files exist and have content
          if [ ! -s backup-careone-db.sql ] || [ ! -s backup-careone-files.sql ]; then
            echo "::error::One or both database exports produced empty files."
            exit 1
          fi

      - name: Encrypt Database Exports with age
        env:
          BACKUP_AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
        run: |
          mkdir -p backups

          if [ -z "$BACKUP_AGE_PUBLIC_KEY" ]; then
            echo "::error::BACKUP_AGE_PUBLIC_KEY secret is missing. Backups must be encrypted with a valid age public key."
            shred -u backup-careone-db.sql backup-careone-files.sql 2>/dev/null || rm -f backup-careone-db.sql backup-careone-files.sql
            exit 1
          fi

          if [[ ! "$BACKUP_AGE_PUBLIC_KEY" =~ ^age1 ]]; then
            echo "::error::BACKUP_AGE_PUBLIC_KEY is invalid: key must start with 'age1'."
            shred -u backup-careone-db.sql backup-careone-files.sql 2>/dev/null || rm -f backup-careone-db.sql backup-careone-files.sql
            exit 1
          fi

          echo "Encrypting database exports with BACKUP_AGE_PUBLIC_KEY..."
          age -r "$BACKUP_AGE_PUBLIC_KEY" -o backups/backup-careone-db.sql.age backup-careone-db.sql
          age -r "$BACKUP_AGE_PUBLIC_KEY" -o backups/backup-careone-files.sql.age backup-careone-files.sql

          # Securely wipe raw plaintext SQL files immediately
          shred -u backup-careone-db.sql backup-careone-files.sql 2>/dev/null || rm -f backup-careone-db.sql backup-careone-files.sql

          if [ -f backup-careone-db.sql ] || [ -f backup-careone-files.sql ]; then
            echo "::error::Failed to delete unencrypted plaintext SQL exports."
            exit 1
          fi

          if [ ! -s backups/backup-careone-db.sql.age ] || [ ! -s backups/backup-careone-files.sql.age ]; then
            echo "::error::Encrypted backup files were not created or are empty."
            exit 1
          fi

      - name: Upload Encrypted Backup Artifacts (30-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: d1-backups-${{ github.run_number }}
          path: backups/*.sql.age
          retention-days: 30
          if-no-files-found: error
