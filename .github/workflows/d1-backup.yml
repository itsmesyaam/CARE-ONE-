name: D1 Automated Database Backups (6-Hour)

# ==============================================================================
# Cloudflare D1 Automated Backup Workflow (Free Plan: $0/mo, No Payment Card)
#
# Context & Requirements:
# - Exports BOTH D1 databases (careone-db and careone-files) via Wrangler.
# - Encrypts exports with 'age' before storage to protect clinical personal data.
# - Stores encrypted backups as GitHub Actions artifacts with 30-day retention.
# - Zero object storage costs, zero Workers Paid, zero Cloudflare paid features.
# - Runs automatically every 6 hours and supports manual trigger (workflow_dispatch).
# ==============================================================================

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: d1-backup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backup:
    name: Export, Encrypt & Store D1 Backups
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install age Encryption Tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age

      - name: Export D1 Databases
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is required to export D1 databases."
            exit 1
          fi

          echo "Exporting careone-db..."
          npx wrangler d1 export careone-db --remote --output backup-careone-db.sql

          echo "Exporting careone-files..."
          npx wrangler d1 export careone-files --remote --output backup-careone-files.sql

          # Verify files exist and have content
          if [ ! -s backup-careone-db.sql ] || [ ! -s backup-careone-files.sql ]; then
            echo "::error::One or both database exports produced empty files."
            exit 1
          fi

      - name: Encrypt Database Exports with age
        env:
          AGE_PUBLIC_KEY: ${{ secrets.AGE_PUBLIC_KEY }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          mkdir -p backups

          if [ -n "$AGE_PUBLIC_KEY" ]; then
            echo "Encrypting with configured AGE_PUBLIC_KEY recipient..."
            age -r "$AGE_PUBLIC_KEY" -o backups/backup-careone-db.sql.age backup-careone-db.sql
            age -r "$AGE_PUBLIC_KEY" -o backups/backup-careone-files.sql.age backup-careone-files.sql
          elif [ -n "$BACKUP_PASSPHRASE" ]; then
            echo "Encrypting with configured BACKUP_PASSPHRASE..."
            echo "$BACKUP_PASSPHRASE" | age -p -o backups/backup-careone-db.sql.age backup-careone-db.sql
            echo "$BACKUP_PASSPHRASE" | age -p -o backups/backup-careone-files.sql.age backup-careone-files.sql
          else
            echo "::warning::No AGE_PUBLIC_KEY or BACKUP_PASSPHRASE configured in repository secrets."
            echo "Generating fallback transient keypair for demonstration encryption..."
            age-keygen -o transient_key.txt
            PUBKEY=$(grep 'public key:' transient_key.txt | cut -d' ' -f4)
            age -r "$PUBKEY" -o backups/backup-careone-db.sql.age backup-careone-db.sql
            age -r "$PUBKEY" -o backups/backup-careone-files.sql.age backup-careone-files.sql
            echo "::warning::To enable permanent decryption, add AGE_PUBLIC_KEY and AGE_SECRET_KEY to repo secrets."
          fi

          # Securely wipe raw plaintext SQL files immediately
          shred -u backup-careone-db.sql backup-careone-files.sql 2>/dev/null || rm -f backup-careone-db.sql backup-careone-files.sql

      - name: Upload Encrypted Backup Artifacts (30-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: d1-backups-${{ github.run_number }}
          path: backups/*.sql.age
          retention-days: 30
          if-no-files-found: error
